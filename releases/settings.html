<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HBVS Settings v7.8.45</title>
<link rel="stylesheet" href="css/global.css?v=7845">
<link rel="stylesheet" href="css/style.css?v=7845">
<style>
.section-label{font-weight:bold;margin:16px 0 8px 0;color:var(--accent);font-size:18px;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.setting-row label{font-weight:500;}
.setting-row select,.setting-row input[type="range"],.setting-row input[type="file"]{padding:6px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--text);}
.toggle-btns button{margin-left:6px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--text);cursor:pointer;}
.toggle-btns button.active{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-row1">
      <a href="index.html" style="font-size:24px;text-decoration:none;color:var(--accent);">←</a>
      <div class="logo-title"><div class="app-title">SETTINGS</div></div>
    </div>
  </header>
  <main style="padding:16px;">

    <div class="section-label">APPEARANCE</div>
    <div class="setting-row">
      <label>Theme Mode</label>
      <select id="theme-select"></select> <!-- [v7845] 10 warmer themes -->
    </div>
    <div class="setting-row">
      <label>App Font</label>
      <select id="font-select"><option value="serif">Serif</option><option value="sans">Sans</option></select>
    </div>
    <div class="setting-row">
      <label>Font Size: <span id="font-size-label">16</span>px</label>
      <input type="range" id="font-size" min="12" max="32" value="16">
    </div>

    <div class="section-label">AUDIO SETTINGS</div>
    <div class="setting-row">
      <label>Enable Audio Sync</label>
      <input type="checkbox" id="audio-sync">
    </div>
    <div class="setting-row">
      <label>Voice Quality</label>
      <div class="toggle-btns"><button id="voice-google">Google TTS</button><button id="voice-neural">Neural</button></div>
    </div>

    <div class="section-label">ADVANCE STUDY</div>
    <div class="setting-row">
      <label>Enable Epilogue</label>
      <input type="checkbox" id="epilogue-toggle">
      <button id="btn-export-epilogue" class="btn-small">Export Epilogue.json</button>
    </div>
    <div class="setting-row">
      <label>Load Study Material</label>
      <input type="file" id="epilogue-file" accept=".txt,.json">
    </div>

    <div class="section-label">TECHNICAL OVERVIEW</div>
    <div class="setting-row"><label><a href="assets/README.md">Readme: HBVS Pedagogy</a></label></div>
    <div class="setting-row"><label><a href="assets/MANUAL.md">Manual: MathKJV Hermeneutic</a></label></div>
    <div class="setting-row"><label><a href="assets/WARRANTY.md">No Warranty Agreement</a></label></div>
    <div class="setting-row"><label><a href="assets/ABOUT.md">About HBVS</a></label></div>

  </main>
</div>

<script src="js/settings.js?v=7845"></script> <!-- [v7845] NEW -->
</body>
</html>
