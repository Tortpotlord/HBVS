<style>
#bibleTab{padding:10px;padding-bottom:110px}
#bookGrid.grid-btn, #chapterGrid.grid-btn, #verseGrid.grid-btn{
  padding:8px 4px;border:1px solid #ddd;background:#fff;border-radius:6px;font-weight:700;cursor:pointer;
  font-size:11px;min-height:38px;line-height:1.2;white-space:normal;text-align:center;
}
.grid-btn.active{background:#800020!important;color:#fff!important;border-color:#800020!important}
.grid-btn.picked{outline:3px solid #8B0000!important;background:rgba(139,0,0,.12)!important;font-weight:900;}
#bookGrid,#chapterGrid,#verseGrid{display:grid;gap:8px;min-height:40px}
#bookGrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
#chapterGrid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
#verseGrid{grid-template-columns:repeat(auto-fill,minmax(55px,1fr))}
#bible-nav-page.view-combined{grid-template-columns:1fr 0.6fr 0.6fr!important;gap:12px!important;border:2px dashed #800020!important;padding:10px!important;border-radius:8px!important}
#bible-nav-page.view-combined #bookGrid{grid-template-columns:repeat(auto-fill,minmax(95px,1fr))}
#bible-nav-page.view-wizard{border:2px solid #800020!important;border-radius:8px!important;padding:10px!important}
.reader-toolbar{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.reader-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-small{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-weight:700;cursor:pointer}
.btn-burgundy{background:#800020!important;color:#fff!important;border-color:#800020!important}
.icon-btn{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);font-weight:900;cursor:pointer}
#topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:2px solid var(--border)}
.topbar-row1{display:flex;gap:10px;align-items:center;padding:10px 12px}
.logo-img{width:48px;height:48px;object-fit:contain;display:block}
.view-tabs{display:flex;gap:6px;margin-left:auto}
.view-tabs button{padding:7px 14px;border:1px solid var(--border);border-radius:20px;font-weight:700;background:var(--bg2);cursor:pointer}
.view-tabs button.active{background:#800020!important;color:#fff!important}
#bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
#bottombar div{text-align:center;font-size:11px;cursor:pointer}
#bottombar div.active{color:#800020;font-weight:900}
#hbvs-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;z-index:100000;opacity:0;transition:opacity.3s;pointer-events:none}
#hbvs-toast.show{opacity:1}
#hbvs-highlight-pop{position:fixed;display:none;z-index:9999;background:#800020;color:#fff;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
#hbvs-picker{position:fixed;bottom:78px;right:12px;z-index:99999;background:#111;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;gap:10px;align-items:center;font-weight:800;}
#hbvs-picker button{padding:7px 12px;border-radius:9px;border:0;font-weight:900;cursor:pointer;}
#hbvs-reader{background:#8B0000;color:#fff;}
#hbvs-copy{background:#444;color:#fff;}
#hbvs-clear{background:#222;color:#fff;}
.card.picked{outline:3px solid #8B0000!important;}
#btn-stats{padding:6px 12px;background:#800020;color:#fff;border:none;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;}
#print-area{display:none;}
#hbvs-print-timestamp{font-family:monospace;}
/* WS ADDITION ONLY */
.verse-sup{font-size:11px!important;font-weight:900!important;vertical-align:super!important;color:#8B0000!important;margin-left:4px;margin-right:2px}
.verse-zero-sup{background:#fff8e7!important;border:1px solid #d4c8a8!important;padding:0 3px;border-radius:3px}
.stitched-view{padding:16px!important;background:#fff!important;line-height:1.9!important}
.ws-label{font-size:12px;font-weight:800;color:#8B0000;display:block;margin-bottom:10px}
@media print{
  #topbar,#bottombar,#bible-nav-page,#hbvs-picker,#hbvs-toast,#hbvs-highlight-pop,#copyModal,#search-dedicated-page{ display:none!important; }
  #readerView{ display:block!important; }
  #readerContent{ padding:0!important; }
  #print-area{ display:block!important; margin:0!important; padding:0!important; }
  #hbvs-print-timestamp{ display:block!important; position:fixed!important; bottom:0!important; left:0!important; right:0!important; text-align:center!important; font-size:9px!important; border-top:1px solid #800020!important; padding:3px!important; background:#fff!important; color:#000!important; }
  body{ padding-bottom:35px!important; }
}
</style>

<script>
document.getElementById('btn-stats')?.addEventListener('click', ()=>{ if(window.HBVS_STATS) window.HBVS_STATS.open(); });
(function(){
  document.documentElement.setAttribute('data-theme','light');
  function dedupBottomBar(){const b1=document.getElementById('bottombar');const b2=document.getElementById('bottom-bar');if(b1 && b2){ b2.remove(); }}setTimeout(dedupBottomBar, 300);setTimeout(dedupBottomBar, 1200);
  function restoreLastView(){const saved = localStorage.getItem('bible_view') || 'default';if(window.setMainView){window.setMainView(saved);document.querySelectorAll('#viewTabs button[data-view]').forEach(b=>{b.classList.toggle('active', b.getAttribute('data-view')===saved);});const lbl=document.getElementById('viewLabel');if(lbl) lbl.innerText = saved.toUpperCase();} else {setTimeout(restoreLastView, 400);}}setTimeout(restoreLastView, 800);
  document.querySelectorAll('#viewTabs button[data-view]').forEach(btn=>{btn.addEventListener('click', (e)=>{const v = e.currentTarget.getAttribute('data-view');if(window.setMainView) window.setMainView(v);});});
  function ensureMap(){if(!window.bookMap || Object.keys(window.bookMap).length < 10) return false;if(localStorage.getItem('hbvs_epilogueJSON')){window.bookMap['Epilogue']=[67,'Epi'];window.bookMap['EPI']=[67,'Epi'];}return true;}
  function inject67(){if(!ensureMap()){ setTimeout(inject67,800); return; }const grid=document.getElementById('bookGrid');if(!grid) return;if(grid.querySelector('[data-bkorder="67"]')) return;if(!localStorage.getItem('hbvs_epilogueJSON')){if(!grid.querySelector('.epilogue-placeholder')){const ph=document.createElement('button');ph.className='grid-btn epilogue-placeholder';ph.style.opacity='0.5';ph.style.borderStyle='dashed';ph.innerHTML='67 Epilogue';ph.title='Save Epilogue in Settings to enable 67th Book';ph.onclick=()=>{ location.href='settings.html?v=78277'; };grid.appendChild(ph);}return;}if(window.buildBookGrid){const f=document.getElementById('bookFilter')?.value||'';try{ window.buildBookGrid(f); }catch(e){}}}setTimeout(inject67, 1000);setTimeout(inject67, 2500);window.addEventListener('hbvs-epilogue-updated', inject67);
})();
window.getAppHeaderText = function(){const t='Holy Bible Vector Space';const s='the sign of the Son of man';const r=document.getElementById('readerTitle')?.innerText || document.getElementById('current-ref')?.innerText || 'HBVS READER';const stamp=new Date().toLocaleString();return `${t}\n${s}\n${r}\nPrinted: ${stamp}\n\n`;};
window.getAppHeaderHtml = function(){const r=document.getElementById('readerTitle')?.innerText || document.getElementById('current-ref')?.innerText || 'HBVS READER';const stamp=new Date().toLocaleString();return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 0 0 0;font-family:serif;line-height:1"><img src="assets/IGoToTheFather.png?v=78277" style="width:64px;height:64px;object-fit:contain;background:transparent!important;border:0!important;box-shadow:none!important;margin:0 0 2px 0;display:block"><div style="font-weight:900;font-size:18px;line-height:1.0">Holy Bible Vector Space</div><div style="font-style:italic;font-size:11px;line-height:1.0;opacity:.85">the sign of the Son of man</div><div style="font-weight:800;font-size:11px;line-height:1.0;margin-top:2px;color:#800020">${r}</div><div style="font-size:9px;opacity:.6;margin-top:2px">Printed: ${stamp}</div></div><hr style="border:none;border-top:3px solid #800020;margin:6px 14px 8px 14px">`;};
</script>
