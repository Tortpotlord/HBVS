<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HBVS Bible Reader v7.8.71</title>

<script>
  window.Capacitor = window.Capacitor || {};
  window.Capacitor.Plugins = window.Capacitor.Plugins || {};
  window.Capacitor.Plugins.App = window.Capacitor.Plugins.App || {
    triggerEvent: function(evt, data){ console.log("[CAP FAKE] triggerEvent:", evt); },
    addListener: function(){ return { remove: function(){} }; },
    removeAllListeners: function(){}
  };
  window.Capacitor.isNativePlatform = function(){ return true; };
  window.Capacitor.getPlatform = function(){ return 'android'; };
  window.Capacitor.whenReady = async function(){ return Promise.resolve(); };
</script>

<script>
window.SafeNotify = window.SafeNotify || function(msg, type = 'info'){
  console.log(`[SafeNotify ${type}]`, msg);
  const toast = document.getElementById('hbvs-toast') || document.createElement('div');
  toast.id = 'hbvs-toast';
  toast.textContent = msg;
  if(!document.getElementById('hbvs-toast')) document.body.appendChild(toast);
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2500);
};
</script>

<link rel="stylesheet" href="css/global.css?v=7871">
<link rel="stylesheet" href="css/style.css?v=7871">
<link rel="stylesheet" href="css/mathkjv.css?v=7871">
<link rel="stylesheet" href="css/superscript.css?v=7871">
<link rel="stylesheet" href="css/preface.css?v=7871">

<style>
/* [v7871] Settings Tab Styles */
#settingsTab.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
#settingsTab label{font-weight:bold;}
#settingsTab select, #settingsTab input[type="range"]{padding:6px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--text);}
#settingsTab.toggle{display:flex;gap:10px;}

/* SEARCH GLASS STYLES */
#searchTab.search-bar{display:flex;gap:8px;margin-bottom:12px;}
#searchTab input{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);}
#searchTab button{padding:8px 12px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;}
mark.search-highlight{background:yellow;color:#000;padding:0 2px;border-radius:2px;}
.search-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;}
.search-table th,.search-table td{border:1px solid var(--border);padding:6px;text-align:left;vertical-align:top;}
.search-table th{background:var(--bg2);}
.search-table.ref-col{width:220px;white-space:nowrap;cursor:pointer;}
.section-label{font-weight:bold;margin:12px 0 6px 0;color:var(--accent);}
.btn-small{padding:4px 8px;font-size:12px;border:none;border-radius:4px;cursor:pointer;}
.btn-danger{background:#c00;color:#fff;}
#search-filter-bar{margin:8px 0;display:none;}
#search-filter-bar select{padding:6px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--text);}
.reader-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.reader-tools span{cursor:pointer;font-size:18px;padding:4px 6px;border-radius:4px;}
.reader-tools span:hover{background:var(--bg2);}
</style>

</head>
<body>
<div id="splash">
  <img src="assets/IGoToTheFather.png?v=7871" alt="Splash Logo"/>
  <p id="splash-text">Loading Reader v7.8.71...</p>
</div>
<div id="overlay"></div>
<div id="app" class="hidden">
  <header id="topbar">
    <div class="topbar-row1">
      <a href="index.html" style="font-size:24px;text-decoration:none;color:var(--accent);">←</a>
      <div class="logo-title"><div class="app-title">HBVS READER</div></div>
      <div class="topbar-icons">
        <button id="btn-tab-reader" title="Reader">📖</button>
        <button id="btn-tab-search" title="Search">🔍</button>
        <!-- REMOVED: Duplicate Settings icon was here. Settings is now only in bottom bar -->
        <button id="btn-view-toggle" title="Toggle Card/Table View">📋</button>
      </div>
    </div>
    <div class="topbar-row2">
      <select id="bible-select"></select>
      <select id="math-select"></select>
    </div>
  </header>
  <main>

    <div id="readerTab">
      <input type="text" id="bookFilter" placeholder="Filter Book: Gen, Exo, Psa, Jde... 68 total" />
      <div class="section-label">BOOK - HEIGHT</div><div id="bookGrid" class="bible-grid"></div>
      <div class="section-label">CHAPTER - DEPTH</div><div id="chapterGrid" class="bible-grid"></div>
      <div class="section-label">VERSE - LENGTH</div><div id="verseGrid" class="bible-grid"></div>

      <div id="readerView" class="reader-view hidden">
        <div class="reader-header">
          <div class="reader-title" id="readerTitle"></div>
          <div class="reader-tools">
            <span id="btn-prev-chap" title="Prev Chapter"><</span>
            <span id="btn-all-chap" title="All Chapter">ALL</span>
            <span id="btn-next-chap" title="Next Chapter">></span>
            <span id="btn-refresh" title="Refresh Page">🔄</span>
            <span id="btn-audio" title="Play Audio">🔊</span>
            <span id="btn-copy-reader" title="Copy">📋</span>
            <span id="btn-share" title="Share">📤</span>
            <span onclick="window.print()" title="Print">🖨️</span>
          </div>
        </div>
        <div id="readerContent"></div>
      </div>
    </div>

    <div id="searchTab" class="hidden">
      <div class="section-label">SEARCH - FIND ALL WHOLE WORDS</div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Enter Phrase OR Location: 1Co3:1" />
        <button id="btn-search">🔍 Search</button>
        <button id="btn-clear-search" class="btn-small btn-danger">Clear</button>
      </div>
      <div id="search-filter-bar">
        <label for="bookFilterSearch">Filter by Book: </label>
        <select id="bookFilterSearch"><option value="ALL">ALL</option></select>
      </div>
      <div id="searchResults"></div>
    </div>

    <!-- [v7871] NEW SETTINGS TAB -->
    <div id="settingsTab" class="hidden">
      <div class="section-label">SETTINGS</div>
      <div class="setting-row">
        <label>Theme</label>
        <div class="toggle">
          <button id="btn-theme-light">Light</button>
          <button id="btn-theme-dark">Dark</button>
        </div>
      </div>
      <div class="section-row">
        <label>Font Family</label>
        <select id="font-select">
          <option value="serif">Serif</option>
          <option value="sans">Sans</option>
        </select>
      </div>
      <div class="section-row">
        <label>Font Size: <span id="font-size-label">16</span>px</label>
        <input type="range" id="font-size" min="14" max="20" value="16">
      </div>
      <div class="section-row">
        <label>Show Epilogue Book</label>
        <input type="checkbox" id="epilogue-toggle">
      </div>
      <div class="section-row">
        <label>Load Epilogue Override</label>
        <input type="file" id="epilogue-file" accept=".txt">
      </div>
    </div>

  </main>
</div>

<!-- [v7.8.65] SHARED LAYOUT -->
<script src="js/layout.js?v=7871"></script>

<script src="js/sql.js-1.8.0/dist/sql-wasm.js"></script>
<script src="js/hbvs_engine.js?v=7871"></script>
<script src="js/search_glass.js?v=7871"></script>
<script src="js/highlight_copy.js?v=7871"></script>
<script src="js/bible.js?v=7871"></script>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  if(window.SearchGlass) SearchGlass.init();
  if(window.HighlightCopy) HighlightCopy.init();

  const btnReader = document.getElementById('btn-tab-reader');
  const btnSearch = document.getElementById('btn-tab-search');
  const readerTab = document.getElementById('readerTab');
  const searchTab = document.getElementById('searchTab');
  const settingsTab = document.getElementById('settingsTab'); // [v7871]

  function setActiveTab(tab){
    [readerTab, searchTab, settingsTab].forEach(t=>t.classList.add('hidden'));
    [btnReader, btnSearch].forEach(b=>b.style.opacity = '0.5');
    if(tab === 'reader'){ readerTab.classList.remove('hidden'); btnReader.style.opacity = '1'; }
    if(tab === 'search'){ searchTab.classList.remove('hidden'); btnSearch.style.opacity = '1'; }
    if(tab === 'settings'){ settingsTab.classList.remove('hidden'); } // Settings now only via bottom bar
  }

  btnReader.onclick = () => setActiveTab('reader');
  btnSearch.onclick = () => setActiveTab('search');
  setActiveTab('reader');
});
</script>

</body>
</html>
