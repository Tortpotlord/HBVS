<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HBVS Bible Reader</title>

<!-- EXTERNAL CSS - Same as Home Page -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mathkjv.css">
<link rel="stylesheet" href="css/superscript.css">
<link rel="stylesheet" href="css/preface.css">

</head>
<body>
<div id="splash">
  <img src="assets/IGoToTheFather.svg" alt="Splash Logo"/>
  <p id="splash-text">Loading Reader...</p>
</div>
<div id="overlay"></div>
<div id="app" class="hidden">
  <header id="topbar">
    <div class="topbar-row1">
      <a href="index.html" style="font-size:24px;text-decoration:none;color:var(--accent);">←</a>
      <div class="logo-title"><div class="app-title">HBVS READER</div></div>
      <div class="topbar-icons">
        <button id="btn-tab-reader" title="Reader">📖</button>
        <button id="btn-tab-search" title="Search">🔍</button>
        <button id="btn-view-toggle" title="Toggle Card/Table View">📋</button>
      </div>
    </div>
    <div class="topbar-row2">
      <select id="bible-select"></select>
      <select id="math-select"></select>
    </div>
  </header>
  <main>
    
    <!-- READER TAB -->
    <div id="readerTab">
      <input type="text" id="bookFilter" placeholder="Filter Book: Gen, Exo, Psa, Jde... 68 total" />
      <div class="section-label">BOOK - HEIGHT</div><div id="bookGrid" class="bible-grid"></div>
      <div class="section-label">CHAPTER - DEPTH</div><div id="chapterGrid" class="bible-grid"></div>
      <div class="section-label">VERSE - LENGTH</div><div id="verseGrid" class="bible-grid"></div>
      
      <div id="readerView" class="reader-view hidden">
        <div class="reader-header">
          <div class="reader-title" id="readerTitle"></div>
          <div class="reader-tools">
            <span id="btn-prev-chap" title="Prev Chapter"><</span>
            <span id="btn-all-chap" title="All Chapter">ALL</span> 
            <span id="btn-next-chap" title="Next Chapter">></span>
            <span id="btn-audio" title="Play Audio">🔊</span>
            <span id="btn-copy-reader" title="Copy">📋</span>
            <span id="btn-share" title="Share">📤</span>
            <span onclick="window.print()" title="Print">🖨️</span>
          </div>
        </div>
        <div id="readerContent"></div>
      </div>
    </div>

    <!-- SEARCH TAB -->
    <div id="searchTab" class="hidden">
      <div class="section-label">SEARCH - FIND ALL WHOLE WORDS</div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Enter phrase to search..." />
        <button id="btn-search">🔍 Search</button>
      </div>
      <div id="searchResults"></div>
    </div>

  </main>
</div>
<script src="js/sql.js-1.8.0/dist/sql-wasm.js"></script>
<script src="js/hbvs_engine.js?v=7817bg&t=20250801_002"></script> <!-- v7.8.17bg PATCH -->
<script src="js/bible.js?v=7817bg"></script> <!-- v7.8.17bg PATCH -->

<script>
// Tab switching logic
document.addEventListener('DOMContentLoaded', ()=>{
  const btnReader = document.getElementById('btn-tab-reader');
  const btnSearch = document.getElementById('btn-tab-search');
  const readerTab = document.getElementById('readerTab');
  const searchTab = document.getElementById('searchTab');

  btnReader.onclick = () => {
    readerTab.classList.remove('hidden');
    searchTab.classList.add('hidden');
    btnReader.style.opacity = '1';
    btnSearch.style.opacity = '0.5';
  }
  btnSearch.onclick = () => {
    searchTab.classList.remove('hidden');
    readerTab.classList.add('hidden');
    btnSearch.style.opacity = '1';
    btnReader.style.opacity = '0.5';
  }
  btnReader.click(); // default to reader tab
});
</script>

</body>
</html>
