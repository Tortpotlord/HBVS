<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HBVS READER - the sign of the Son of man</title>
<link rel="stylesheet" href="css/global.css?v=782016">
<link rel="stylesheet" href="css/style.css?v=782016">
<link rel="stylesheet" href="css/preface.css?v=782016">
<link rel="stylesheet" href="css/mathkjv.css?v=782016">
<link rel="stylesheet" href="css/superscript.css?v=782016">
<style>
#bibleTab{padding:10px}
.chip{padding:8px 14px;border:1px solid var(--border);background:var(--bg);border-radius:18px;cursor:pointer;font-weight:700}
.chip.big{min-width:64px;min-height:42px}
.chip.active,.grid-btn.active{background:var(--accent);color:#fff}
.book-card{padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--bg2);font-weight:800;cursor:pointer}
.grid-btn{padding:8px 10px;border:1px solid var(--border);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:700}
#bookGrid,#chapterGrid,#verseGrid{display:grid;gap:8px}
#bookGrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
#chapterGrid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
#verseGrid{grid-template-columns:repeat(auto-fill,minmax(55px,1fr))}
#bible-grid{display:none}
#search-page{border:2px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
#searchInput{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px}
.reader-toolbar{position:sticky;top:0;z-index:50;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px;margin:12px 0}
#readerView{margin-top:16px;border-top:2px solid var(--border);padding-top:10px}
.btn-small{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;font-weight:600}
#topbar{position:sticky;top:0;z-index:100;background:var(--bg);transition:transform 0.3s}
#topbar.hidden-bar{transform:translateY(-100%)}
#bottombar{transition:transform 0.3s}
#bottombar.hidden-bar{transform:translateY(100%)}
.logo-img{width:32px;height:32px;border-radius:6px;object-fit:cover}
.logo-title{font-weight:900;font-size:16px}
.subtitle{padding:2px 10px 6px 52px;font-size:12px;opacity:0.8;font-style:italic}
#hbvs-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:8px;opacity:0;transition:opacity.3s;z-index:9999}
#hbvs-toast.show{opacity:1}
.verse-block{ transition: all 0.2s ease; cursor:pointer; }
.verse-block.picked{ background:#e8f5e9; border-left:4px solid #0a7; }
.grid-btn.picked{background:#0a7!important;color:#fff!important;border-color:#0a7!important;}
</style>
</head>
<body>
<div id="splash"><p id="splash-text">HBVS READER v7.8.216 - Gen22:2 n=2/3 fix + Ref parse</p></div>
<div id="app" class="hidden">
  <header id="topbar">
    <div class="topbar-row1" style="display:flex;gap:8px;align-items:center;padding:8px 10px">
      <button class="hamburger" onclick="location.href='index.html'">←</button>
      <img src="assets/IGoToTheFather.png" class="logo-img" alt="logo" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='inline-flex'">
      <span id="fallbackLogo" style="display:none;width:32px;height:32px;background:#111;color:#fff;border-radius:6px;align-items:center;justify-content:center;font-weight:900">✝️</span>
      <div style="display:flex;flex-direction:column">
        <div class="logo-title">HBVS READER</div>
        <div style="font-size:9px;opacity:0.6">Holy Bible Vector Space</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button id="bible-view-toggle" class="btn-small">View</button>
        <button class="btn-small" onclick="openSearchPage()">🔍</button>
        <button class="btn-small" onclick="openReaderTab()">📖</button>
        <button id="btn-view-toggle-main" class="btn-small">📋/📖</button>
        <button class="btn-small" onclick="toggleFullScreenReader()">⛶</button>
      </div>
    </div>
    <div class="subtitle">the sign of the Son of man</div>
  </header>

  <main style="padding:10px">
    <section id="bibleTab">
      <div id="search-page" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <b>🔍 SEARCH GLASS</b>
          <div style="display:flex;gap:6px">
            <button class="btn-small" onclick="openReaderTab()">📖 Reader</button>
            <button class="btn-small" onclick="closeSearchPage()">✕</button>
          </div>
        </div>
        <input type="text" id="searchInput" placeholder="Phrase or Gen1:1">
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button id="btn-search" class="btn-small">Search</button>
          <button id="btn-clear-search" class="btn-small">Clear</button>
          <select id="bookFilterSearch"></select>
          <select id="mathFilterSearch"><option value="akjv">AKJV</option><option value="P">P</option><option value="S">S</option><option value="T">T</option><option value="superscript">Super</option></select>
        </div>
        <div id="searchResults" style="margin-top:12px;max-height:70vh;overflow-y:auto"></div>
      </div>

      <div id="bible-nav-page">
        <div class="grid-section"><h3>📚 Books (Height)</h3><div id="bookGrid"></div></div>
        <div class="grid-section"><h3>📖 Chapters (Depth) <button id="btn-prev-chap" class="btn-small">←</button> <button id="btn-next-chap" class="btn-small">→</button> <button id="btn-all-chap" class="btn-small">All (Breadth)</button></h3><div id="chapterGrid"></div></div>
        <div class="grid-section"><h3>🔢 Verses (Length) <span style="font-size:11px;opacity:0.5">Tap=pick whole verse, Drag=subset</span></h3><div id="verseGrid"></div></div>
        <div id="bible-grid"></div>
      </div>

      <div id="readerView" class="hidden">
        <div class="reader-toolbar">
          <b id="readerTitle" style="margin-right:auto">HBVS READER</b>
          <div style="display:flex;gap:6px;align-items:center">
            <select id="bible-select"></select>
            <select id="math-select"></select>
            <button id="btn-copy-exact" class="btn-small" style="background:#111;color:#fff;font-weight:800" title="Copy ONLY selected verses Ref+Text for StudyHub">📋 Ref+Text</button>
          </div>
        </div>
        <div id="readerContent" style="padding:12px;line-height:1.7"></div>
        <div id="reader-view" style="display:none"><div id="reader-cards"></div></div>
      </div>
    </section>
  </main>

  <nav id="bottombar">
    <div onclick="location.href='index.html'">🏠<br>Home</div>
    <div class="active">📖<br>HBVS</div>
    <div onclick="openSearchPage()">🔍<br>Search</div>
    <div onclick="location.href='settings.html'">⚙️<br>Settings</div>
  </nav>
</div>

<script src="js/sql.js-1.8.0/dist/sql-wasm.js"></script>
<script src="js/hbvs_engine.js?v=78224"></script>
<script src="js/hbvs_worker.js?v=782016"></script>
<script src="js/search_glass.js?v=782016"></script>
<script src="js/bible.js?v=78222"></script>
<script src="js/highlight_copy.js?v=78223"></script>
<script>
let lastScroll=0, isFullReader=false;
function openSearchPage(){document.getElementById('search-page').style.display='block';document.getElementById('bible-nav-page').style.display='none';document.getElementById('searchInput').focus();}
function closeSearchPage(){document.getElementById('search-page').style.display='none';document.getElementById('bible-nav-page').style.display='block';}
function openReaderTab(){closeSearchPage();document.getElementById('readerView').scrollIntoView({behavior:'smooth'});}
function toggleFullScreenReader(){
  isFullReader=!isFullReader;
  const nav=document.getElementById('bible-nav-page');
  const tb=document.getElementById('topbar'), bb=document.getElementById('bottombar');
  if(isFullReader){nav.style.display='none';document.getElementById('search-page').style.display='none';tb.classList.add('hidden-bar');bb.classList.add('hidden-bar');}
  else{nav.style.display='block';tb.classList.remove('hidden-bar');bb.classList.remove('hidden-bar');}
}
window.addEventListener('scroll',()=>{
  let st=window.pageYOffset; let tb=document.getElementById('topbar'), bb=document.getElementById('bottombar');
  let readerTop=document.getElementById('readerView')?.offsetTop||1200;
  if(st>readerTop-120){
    if(st>lastScroll && st>400){tb.classList.add('hidden-bar');bb.classList.add('hidden-bar');}
    else{tb.classList.remove('hidden-bar');bb.classList.remove('hidden-bar');}
  } else {tb.classList.remove('hidden-bar');bb.classList.remove('hidden-bar');}
  lastScroll=st;
},{passive:true});
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btn-view-toggle-main')?.addEventListener('click',()=>document.getElementById('bible-view-toggle')?.click());
  // FIXED observer: store PCE raw for correct n counting
  const obs=new MutationObserver(()=>{
    document.querySelectorAll('#readerContent.verse-block, #reader-cards.verse-block').forEach(block=>{
      let bEl=block.querySelector('b');
      let bText=bEl?.innerText?.trim()||"";
      // Parse Gen 22:2 etc
      let m=bText.match(/([A-Za-z0-9]+)\s*0*([0-9]+):0*([0-9]+)/);
      if(m){
        if(!block.getAttribute('data-bk')) block.setAttribute('data-bk', m[1]);
        if(!block.getAttribute('data-chap')) block.setAttribute('data-chap', m[2]);
        if(!block.getAttribute('data-verse')) block.setAttribute('data-verse', m[3]);
        block.setAttribute('data-ref', `${m[1]}${m[2]}:${m[3]}`);
        // bkorder for Genesis=1
        if(!block.getAttribute('data-bkorder')){
          if(typeof bookMap!=='undefined'){
            let key=Object.keys(bookMap).find(k=>k.toLowerCase()===m[1].toLowerCase());
            if(key) block.setAttribute('data-bkorder', bookMap[key][0]);
            else block.setAttribute('data-bkorder', '1');
          } else {
            block.setAttribute('data-bkorder', '1');
          }
        }
      }
      // Store PCE raw (AKJV) separately for counting of's
      if(typeof getFullVerseFromDB==='function'){
        try{
          let bkorder=parseInt(block.getAttribute('data-bkorder')||'1');
          let chap=parseInt(block.getAttribute('data-chap')||'0');
          let verse=parseInt(block.getAttribute('data-verse')||'0');
          if(chap&&verse){
            let pceRaw=getFullVerseFromDB(bkorder,chap,verse);
            if(pceRaw) block.setAttribute('data-raw-pce', pceRaw);
          }
        }catch(e){}
      }
      if(!block.getAttribute('data-raw')){
        let raw=block.innerText.replace(bText,'').trim();
        block.setAttribute('data-raw', raw);
      }
    });
  });
  const rc=document.getElementById('readerContent');
  const rcds=document.getElementById('reader-cards');
  if(rc) obs.observe(rc, {childList:true, subtree:true});
  if(rcds) obs.observe(rcds, {childList:true, subtree:true});
});
</script>
</body>
</html>
