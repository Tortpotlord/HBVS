<style>
#bibleTab{padding:10px;padding-bottom:110px}
.grid-btn{padding:8px 4px;border:1px solid #ddd;background:#fff;border-radius:6px;font-weight:700;cursor:pointer;font-size:11px;min-height:38px;line-height:1.2;white-space:normal;text-align:center;}
.grid-btn.active{background:#800020!important;color:#fff!important;border-color:#800020!important}
.grid-btn.picked{outline:3px solid #8B0000!important;background:rgba(139,0,0,.12)!important;font-weight:900;}
#bookGrid,#chapterGrid,#verseGrid{display:grid;gap:8px;min-height:40px}
#bookGrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
#chapterGrid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
#verseGrid{grid-template-columns:repeat(auto-fill,minmax(55px,1fr))}
#bible-nav-page{display:grid;gap:12px}
#bible-nav-page.view-default{grid-template-columns:1fr}
#bible-nav-page.view-combined{grid-template-columns:1fr 0.6fr 0.6fr!important;gap:12px!important;border:2px dashed #800020!important;padding:10px!important;border-radius:8px!important}
#bible-nav-page.view-wizard{grid-template-columns:1fr!important;border:2px solid #800020!important;border-radius:8px!important;padding:10px!important}
#bible-nav-page.view-wizard #bookGrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
#bible-nav-page.view-wizard #chapterGrid,
#bible-nav-page.view-wizard #verseGrid{display:grid!important}
.reader-toolbar{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;margin:12px 0;display:flex!important;flex-direction:column;gap:8px;visibility:visible!important;opacity:1!important}
.reader-row{display:flex!important;gap:6px;flex-wrap:wrap;align-items:center;visibility:visible!important}
.btn-small{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-weight:700;cursor:pointer;display:inline-block!important;visibility:visible!important;opacity:1!important}
.btn-burgundy{background:#800020!important;color:#fff!important;border-color:#800020!important}
.icon-btn{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);font-weight:900;cursor:pointer}
#topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:2px solid var(--border)}
.topbar-row1{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.hbvs-formal-logo{width:100%;max-width:560px;height:auto;display:block;background:white!important;border:0!important}
.view-tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.view-tabs button{padding:7px 14px;border:1px solid var(--border);border-radius:20px;font-weight:700;background:var(--bg2);cursor:pointer}
.view-tabs button.active{background:#800020!important;color:#fff!important}
#bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
#bottombar div{text-align:center;font-size:11px;cursor:pointer}
#bottombar div.active{color:#800020;font-weight:900}
#hbvs-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;z-index:100000;opacity:0;transition:opacity.3s;pointer-events:none}
#hbvs-toast.show{opacity:1}
#hbvs-picker{position:fixed;bottom:78px;right:12px;z-index:99999;background:#111;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;gap:10px;align-items:center;font-weight:800;}
#hbvs-picker button{padding:7px 12px;border-radius:9px;border:0;font-weight:900;cursor:pointer;}
#hbvs-reader{background:#8B0000;color:#fff;}
#hbvs-copy{background:#444;color:#fff;}
#hbvs-clear{background:#222;color:#fff;}
#btn-stats{padding:6px 12px;background:#800020;color:#fff;border:none;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;}
#print-area{display:none;}
.verse-sup{font-size:11px!important;font-weight:900!important;vertical-align:super!important;color:#8B0000!important;margin-left:4px;margin-right:2px}
.stitched-view{padding:16px!important;background:#fff!important;line-height:1.9!important}
@media print{#topbar,#bottombar,#bible-nav-page,#hbvs-picker,#hbvs-toast,#copyModal{display:none!important;}#readerView{display:block!important;}}
.grid-btn.picked{background:#800020!important;color:#fff!important;box-shadow:inset 0 0 0 2px #FFD700}
body > #viewTabs, body > .view-tabs, body > .bible-view-tabs {display:none!important;}
#topbar #viewTabs{display:flex!important;}
#readerAudioBar{position:static!important;transform:none!important;z-index:1!important}
/* v303 FORCE - COMBO + BUTTONS ALWAYS VISIBLE - NO UI CHANGE */
#bible-select, #math-select{display:inline-block!important;visibility:visible!important;opacity:1!important;min-width:200px!important;max-width:320px!important;padding:8px 12px!important;border:2px solid #800020!important;border-radius:8px!important;background:#fff!important;color:#000!important;font-weight:900!important;font-size:14px!important;z-index:9999!important;}
#math-select option, #bible-select option{color:#000!important;background:#fff!important}
#r-prev,#r-all,#r-next,#r-refresh,#r-copy,#r-share,#r-print,#btn-view-toggle-main,#btn-view-ws-main{display:inline-block!important;visibility:visible!important;opacity:1!important}
</style>
</head>

<script>
window.HBVS_AUDIO_FIX=window.HBVS_AUDIO_FIX||window.HBVS_AUDIO_SYNC;
document.getElementById('btn-stats')?.addEventListener('click',()=>{if(window.HBVS_STATS) window.HBVS_STATS.open();});
(function(){
  document.documentElement.setAttribute('data-theme','light');
  function restoreLastView(){const saved=localStorage.getItem('bible_view')||'default';if(window.setMainView){window.setMainView(saved);document.querySelectorAll('#viewTabs button[data-view]').forEach(b=>{b.classList.toggle('active',b.getAttribute('data-view')===saved);});const lbl=document.getElementById('viewLabel');if(lbl) lbl.innerText=saved.toUpperCase();}else{setTimeout(restoreLastView,400);}}setTimeout(restoreLastView,800);
  document.querySelectorAll('#viewTabs button[data-view]').forEach(btn=>{btn.addEventListener('click',e=>{const v=e.currentTarget.getAttribute('data-view');if(window.setMainView) window.setMainView(v);});});
})();
window.HBVS_FORMAL_LOGO_SVG=`<svg class="hbvs-formal-logo" viewBox="0 0 850 120" xmlns="http://www.w3.org/2000/svg"><rect width="850" height="120" fill="white"/><g font-family="Georgia, serif"><text x="8" y="24" font-size="18" fill="#8A8A8A">Lim Son(x)</text><text x="8" y="50" font-size="11.5" fill="#555">x ↦ man</text><text x="8" y="88" font-size="20" fill="#8A8A8A">= Father</text></g><line x1="138" y1="10" x2="138" y2="110" stroke="#AAA" stroke-width="1"/><g font-family="Georgia, serif"><text x="152" y="46" font-size="30" font-weight="700" fill="#7A4A1E">Holy Bible Vector Space</text><text x="152" y="92" font-size="22" font-style="italic" fill="#8A8A8A">the sign of the Son of man</text></g></svg>`;
window.getAppHeaderText=function(){const t='Holy Bible Vector Space';const s='the sign of the Son of man';const r=document.getElementById('readerTitle')?.innerText||'HBVS READER';const stamp=new Date().toLocaleString();return `${t}\n${s}\nLim Son(x)\nx ↦ man\n= Father\n${r}\nPrinted: ${stamp}\n\n`;};
window.getAppHeaderHtml=function(){const r=document.getElementById('readerTitle')?.innerText||'HBVS READER';const stamp=new Date().toLocaleString();return `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 0 0;background:white;font-family:serif;line-height:1">${window.HBVS_FORMAL_LOGO_SVG}<div style="font-weight:800;font-size:11px;margin-top:4px;color:#800020">${r}</div><div style="font-size:9px;opacity:.6;margin-top:2px">Printed: ${stamp}</div></div><hr style="border:none;border-top:3px solid #800020;margin:6px 14px 8px 14px">`;};
</script>
